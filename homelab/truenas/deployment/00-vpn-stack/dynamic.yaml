http:
  routers:
    dashboard:
      rule: "Host(`home-media.akita-beaufort.ts.net`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api/http`) || PathPrefix(`/api/tcp`) || PathPrefix(`/api/udp`) || PathPrefix(`/api/overview`) || PathPrefix(`/api/version`) || PathPrefix(`/api/entrypoints`) || PathPrefix(`/api/rawdata`))"
      entryPoints:
        - websecure
      tls:
        certResolver: tailscale
      service: api@internal
      middlewares:
        - authelia@docker
        # - setup-auth@file
        - dashboard-slash
        # - dashboard-auth

  middlewares:
    # Temporary setup gate. Enable during media setup, then remove after the SSO rollout.
    # Generate the hash with:
    # docker run --rm httpd:alpine htpasswd -nbB setup 'your-password'
    # setup-auth:
    #   basicAuth:
    #     users:
    #       - "setup:$2y$..."
    # dashboard-auth:
    #   basicAuth:
    #     users:
    #       - "truenas_admin:$2y$05$yZc2oknLeQnh5nSVImOF1ugMQjFhwWB56VBypJR91iuD.yUzr0e/y"
    dashboard-slash:
      redirectRegex:
        regex: "^https://home-media.akita-beaufort.ts.net/dashboard$"
        replacement: "https://home-media.akita-beaufort.ts.net/dashboard/"
        permanent: true