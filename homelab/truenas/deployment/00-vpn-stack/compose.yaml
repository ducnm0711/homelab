version: "3.8"

services:
  # --- TIER 00: GATEWAY & ROUTING ---
  00-traefik:
    image: traefik:v3.7.16
    container_name: 00-traefik
    hostname: home-media
    restart: unless-stopped
    networks:
      proxy:
        aliases:
          - traefik
          - gateway
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - tailscale-sock:/var/run/tailscale:rw
      - /mnt/fast/app/traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    expose:
      - "80"
      - "443"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.http.tls.certResolver=tailscale"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.tailscale.tailscale=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--log.level=INFO"

  # --- TIER 01: VPN / SECURE TUNNEL ---
  01-tailscale:
    image: ghcr.io/tailscale/tailscale:v1.104.2
    container_name: 01-tailscale
    restart: unless-stopped
    network_mode: "service:00-traefik"
    depends_on:
      - 00-traefik
    environment:
      - TS_AUTHKEY=tskey-auth-change-me
      - TS_HOSTNAME=home-media
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SOCKET=/var/run/tailscale/tailscaled.sock
      - TS_EXTRA_ARGS=--accept-dns=false
    volumes:
      - tailscale-home-media-state:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale:rw
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  # --- TIER 02: DASHBOARD ---
  02-homepage:
    image: ghcr.io/gethomepage/homepage:v2.6.0
    container_name: 02-homepage
    restart: unless-stopped
    depends_on:
      00-traefik:
        condition: service_started
    networks:
      proxy:
        aliases:
          - homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: home-media.akita-beaufort.ts.net
      PUID: 568
      PGID: 568
    volumes:
      - /mnt/fast/app/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro 
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.homepage.rule=Host(`home-media.akita-beaufort.ts.net`)"
      - "traefik.http.routers.homepage.entrypoints=websecure"
      - "traefik.http.routers.homepage.tls=true"
      - "traefik.http.routers.homepage.tls.certresolver=tailscale"
      - "traefik.http.services.homepage.loadbalancer.server.port=3000"

volumes:
  tailscale-home-media-state:
  tailscale-sock:

networks:
  proxy:
    name: proxy
    external: true