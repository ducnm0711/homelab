x-common-env: &common-env
  PUID: 568
  PGID: 568
  TZ: Etc/GMT-7

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    networks:
      - proxy
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - /mnt/fast/app/qbittorrent:/config
      - /mnt/media-01:/movies
      - /mnt/media-02:/series
    expose:
      - "8080"
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.qbittorrent.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/qbittorrent`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.tls.certresolver=tailscale"
      - "traefik.http.routers.qbittorrent.middlewares=qbittorrent-strip"
      - "traefik.http.middlewares.qbittorrent-strip.stripprefix.prefixes=/qbittorrent"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    depends_on:
      - qbittorrent
    networks:
      - proxy
    environment:
      <<: *common-env
      PROWLARR__SERVER__URLBASE: /prowlarr
    volumes:
      - /mnt/fast/app/prowlarr:/config
    expose:
      - "9696"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.prowlarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/prowlarr`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.tls.certresolver=tailscale"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    depends_on:
      - prowlarr
      - qbittorrent
    networks:
      - proxy
    environment:
      <<: *common-env
      RADARR__SERVER__URLBASE: /radarr
    volumes:
      - /mnt/fast/app/radarr:/config
      - /mnt/media-01:/movies
    expose:
      - "7878"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.radarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/radarr`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=tailscale"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    depends_on:
      - prowlarr
      - qbittorrent
    networks:
      - proxy
    environment:
      <<: *common-env
      SONARR__SERVER__URLBASE: /sonarr
    volumes:
      - /mnt/fast/app/sonarr:/config
      - /mnt/media-02:/series
    expose:
      - "8989"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.sonarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/sonarr`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=tailscale"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    depends_on:
      - radarr
      - sonarr
    networks:
      - proxy
    environment:
      <<: *common-env
      BAZARR__SERVER__URLBASE: /bazarr
    volumes:
      - /mnt/fast/app/bazarr:/config
      - /mnt/media-01:/movies
      - /mnt/media-02:/series
    expose:
      - "6767"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.bazarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/bazarr`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=tailscale"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
    restart: unless-stopped

  permissions-fix:
    image: alpine:3.24.3
    container_name: jellyfin-permissions
    user: "root"
    volumes:
      - jellyfin-transcodes:/cache/transcodes
    command: >
      sh -c '
        echo "==> Setting permissions on /cache/transcodes..."
        if chown -R 568:568 /cache/transcodes && chmod -R 775 /cache/transcodes; then
          echo "[SUCCESS] Permissions updated successfully!"
          exit 0
        else
          echo "[ERROR] Failed to set permissions!"
          exit 1
        fi
      '

  jellyfin:
    image: jellyfin/jellyfin:12.3
    container_name: jellyfin
    depends_on:
      permissions-fix:
        condition: service_completed_successfully
      radarr:
        condition: service_started
      sonarr:
        condition: service_started
    restart: unless-stopped
    user: '568:568'
    networks:
      - proxy
    environment:
      TZ: Etc/GMT-7
      JELLYFIN_CACHE_DIR: /cache
      JELLYFIN_NetworkConfiguration__BaseUrl: /jellyfin
    expose:
      - "8096"
    volumes:
      - /mnt/fast/app/jellyfin:/config
      - /mnt/fast/app/jellyfin/cache:/cache
      - jellyfin-transcodes:/cache/transcodes
      - /mnt/media-01:/movies
      - /mnt/media-02:/series
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.jellyfin.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/jellyfin`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.tls.certresolver=tailscale"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

volumes:
  jellyfin-transcodes:

networks:
  proxy:
    external: true