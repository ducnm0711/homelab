x-common-env: &common-env
  PUID: 568
  PGID: 568
  TZ: Etc/GMT-7

services:
  # --- TIER 00: INIT TASKS ---
  00-permissions-fix:
    image: alpine:3.24.3
    container_name: 00-jellyfin-permissions
    user: "root"
    volumes:
      - jellyfin-transcodes:/cache/transcodes
    command: >
      sh -c '
        echo "==> Setting permissions on /cache/transcodes..."
        if chown -R 568:568 /cache/transcodes && chmod -R 775 /cache/transcodes; then
          echo "[SUCCESS] Permissions updated successfully!"
          exit 0
        else
          echo "[ERROR] Failed to set permissions!"
          exit 1
        fi
      '

  # --- TIER 01: CORE SERVICES (PARALLEL) ---
  01-byparr:
    image: ghcr.io/thephaseless/byparr:3.0.4
    container_name: 01-byparr
    networks:
      proxy:
        aliases:
          - byparr
    environment:
      TZ: Etc/GMT-7
      LOG_LEVEL: INFO
    shm_size: "1gb"
    volumes:
      - /mnt/fast/app/byparr:/home/byparr/.cache
    ports:
      - 8191:8191       # FlareSolverr-compatible API
    restart: unless-stopped

  01-qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: 01-qbittorrent
    networks:
      proxy:
        aliases:
          - qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: 8080
    volumes:
      - /mnt/fast/app/qbittorrent:/config
      - /mnt/media-01:/movies
      - /mnt/media-02:/series
    ports:
      - 8080:8080       # Web UI (Local LAN Access)
      - 6881:6881       # Torrent TCP
      - 6881:6881/udp   # Torrent UDP
    restart: unless-stopped

  # --- TIER 02: INDEXER HUB ---
  02-prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: 02-prowlarr
    depends_on:
      01-byparr:
        condition: service_started
      01-qbittorrent:
        condition: service_started
    networks:
      proxy:
        aliases:
          - prowlarr
    environment:
      <<: *common-env
    volumes:
      - /mnt/fast/app/prowlarr:/config
    ports:
      - 9696:9696       # Web UI (Local LAN Access)
    restart: unless-stopped

  # --- TIER 03: PVR MANAGERS (PARALLEL) ---
  03-radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: 03-radarr
    depends_on:
      01-qbittorrent:
        condition: service_started
      02-prowlarr:
        condition: service_started
    networks:
      proxy:
        aliases:
          - radarr
    environment:
      <<: *common-env
    volumes:
      - /mnt/fast/app/radarr:/config
      - /mnt/media-01:/movies
    ports:
      - 7878:7878
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/radarr`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=tailscale"
      - "traefik.http.routers.radarr.middlewares=authelia@docker"
      # - "traefik.http.routers.radarr.middlewares=setup-auth@file"
    restart: unless-stopped

  03-sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: 03-sonarr
    depends_on:
      01-qbittorrent:
        condition: service_started
      02-prowlarr:
        condition: service_started
    networks:
      proxy:
        aliases:
          - sonarr
    environment:
      <<: *common-env
    volumes:
      - /mnt/fast/app/sonarr:/config
      - /mnt/media-02:/series
    ports:
      - 8989:8989
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/sonarr`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.tls.certresolver=tailscale"
      - "traefik.http.routers.sonarr.middlewares=authelia@docker"
      # - "traefik.http.routers.sonarr.middlewares=setup-auth@file"
    restart: unless-stopped

  # --- TIER 04: DOWNSTREAM CONSUMERS (PARALLEL) ---
  04-bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: 04-bazarr
    depends_on:
      03-radarr:
        condition: service_started
      03-sonarr:
        condition: service_started
    networks:
      proxy:
        aliases:
          - bazarr
    environment:
      <<: *common-env
      BAZARR__SERVER__URLBASE: /bazarr
    volumes:
      - /mnt/fast/app/bazarr:/config
      - /mnt/media-01:/movies
      - /mnt/media-02:/series
    ports:
      - 6767:6767
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/bazarr`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.tls.certresolver=tailscale"
      - "traefik.http.routers.bazarr.middlewares=authelia@docker"
      # - "traefik.http.routers.bazarr.middlewares=setup-auth@file"
    restart: unless-stopped

  04-jellyfin:
    image: jellyfin/jellyfin:12.3
    container_name: 04-jellyfin
    depends_on:
      00-permissions-fix:
        condition: service_completed_successfully
      03-radarr:
        condition: service_started
      03-sonarr:
        condition: service_started
    restart: unless-stopped
    user: '568:568'
    networks:
      proxy:
        aliases:
          - jellyfin
    environment:
      TZ: Etc/GMT-7
      JELLYFIN_CACHE_DIR: /cache
      JELLYFIN_NetworkConfiguration__BaseUrl: /jellyfin
    ports:
      - '8096:8096'
    volumes:
      - /mnt/fast/app/jellyfin:/config
      - /mnt/fast/app/jellyfin/cache:/cache
      - jellyfin-transcodes:/cache/transcodes
      - /mnt/media-01:/movies
      - /mnt/media-02:/series
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`home-media.akita-beaufort.ts.net`) && PathPrefix(`/jellyfin`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.tls.certresolver=tailscale"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
      # - "traefik.http.routers.jellyfin.middlewares=setup-auth@file"

volumes:
  jellyfin-transcodes:

networks:
  proxy:
    external: true