# Place at /mnt/fast/app/authelia/config/configuration.yml
#
# Also needed in /mnt/fast/app/authelia/config/ (readable by uid 568):
#   users.yml
#   secrets/session_secret   openssl rand -hex 32
#   secrets/storage_key      openssl rand -hex 32

theme: auto

server:
  address: 'tcp://:9091/auth'

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
  password_reset:
    disable: true

access_control:
  default_policy: deny
  rules:
    - domain: home-media.akita-beaufort.ts.net
      policy: bypass
      resources:
        - '^/auth(/.*)?$'
    - domain: home-media.akita-beaufort.ts.net
      policy: one_factor

session:
  cookies:
    - domain: home-media.akita-beaufort.ts.net
      authelia_url: https://home-media.akita-beaufort.ts.net/auth
      default_redirection_url: https://home-media.akita-beaufort.ts.net/
      expiration: 12h
      inactivity: 2h

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt