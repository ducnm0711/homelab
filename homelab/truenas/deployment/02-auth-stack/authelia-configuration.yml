# Place at /mnt/fast/app/authelia/configuration.yml
#
# Also needed in /mnt/fast/app/authelia/:
#   users.yml                      (see users.yml example in the chat)
#   secrets/jwt_secret             random 64 chars
#   secrets/session_secret         random 64 chars
#   secrets/storage_key            random 64 chars
#   secrets/oidc_hmac              random 64 chars
#   secrets/oidc.pem               RSA private key (authelia crypto pair rsa generate)
#   secrets/portainer_client.digest  pbkdf2 digest for the Portainer client secret
#   secrets/jellyfin_client.digest   pbkdf2 digest for the Jellyfin client secret

theme: auto

server:
  address: 'tcp://:9091/auth'

log:
  level: info

authentication_backend:
  file:
    path: /config/users.yml
  password_reset:
    disable: true

access_control:
  default_policy: deny
  rules:
    # Apps that handle auth themselves, or must stay reachable by API clients
    - domain: homelab.akita-beaufort.ts.net
      policy: bypass
      resources:
        - '^/auth([/?].*)?$'
        - '^/portainer([/?].*)?$'                              # Portainer uses its own OAuth
        - '^/jellyfin([/?].*)?$'                               # Jellyfin SSO plugin + native apps
        - '^/(sonarr|radarr|prowlarr|bazarr)/api([/?].*)?$'    # API-key clients
    # Everything else (Homepage, *arr UIs, qBittorrent, Traefik dashboard...)
    - domain: homelab.akita-beaufort.ts.net
      policy: one_factor

session:
  secret: ''   # supplied via AUTHELIA_SESSION_SECRET_FILE
  cookies:
    - domain: homelab.akita-beaufort.ts.net
      authelia_url: https://homelab.akita-beaufort.ts.net/auth
      default_redirection_url: https://homelab.akita-beaufort.ts.net/
      expiration: 12h
      inactivity: 2h

storage:
  local:
    path: /config/db.sqlite3

notifier:
  filesystem:
    filename: /config/notification.txt

identity_providers:
  oidc:
    jwks:
      - key: {{ secret "/config/secrets/oidc.pem" | mindent 10 "|" | msquote }}
    clients:
      - client_id: portainer
        client_name: Portainer
        client_secret: '{{ secret "/config/secrets/portainer_client.digest" }}'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          - https://homelab.akita-beaufort.ts.net/portainer/
        scopes: [openid, profile, email, groups]
        token_endpoint_auth_method: client_secret_post

      - client_id: jellyfin
        client_name: Jellyfin
        client_secret: '{{ secret "/config/secrets/jellyfin_client.digest" }}'
        public: false
        authorization_policy: one_factor
        redirect_uris:
          # verify against the SSO-Auth plugin docs for your plugin version
          - https://homelab.akita-beaufort.ts.net/jellyfin/sso/OID/redirect/authelia
        scopes: [openid, profile, email, groups]
        token_endpoint_auth_method: client_secret_post
