version: "3.8"

services:
  # Downloader (Exposed directly to local network)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=568
      - PGID=568
      - TZ=Asia/Ho_Chi_Minh
      - WEBUI_PORT=8080
    volumes:
      - /mnt/SSD/config/qbittorrent:/config
      - /mnt/tier-2-hdd-stripe-test/media:/media
    ports:
      - 8080:8080       # Local Web UI
      - 6881:6881       # Torrent TCP
      - 6881:6881/udp   # Torrent UDP
    restart: unless-stopped

# Indexer Manager (Exposed directly to local network)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2
    container_name: prowlarr
    environment:
      - PUID=568
      - PGID=568
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /mnt/SSD/config/prowlarr:/config
    ports:
      - 9696:9696       # Web UI
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls312
    container_name: radarr
    networks:
      - proxy
    environment:
      - PUID=568
      - PGID=568
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - /mnt/SSD/config/radarr:/config
      - /mnt/tier-2-hdd-stripe-test/media:/media
    ports:
      - 7878:7878
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`homelab.akita-beaufort.ts.net`) && PathPrefix(`/radarr`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.tls.certresolver=tailscale"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    restart: unless-stopped

# 1. The Init Container runs first, fixes permissions, then exits.
  permissions-fix:
    image: alpine:latest
    container_name: jellyfin-permissions
    # Do not set restart policy here, we only want it to run once per deployment
    user: "root"
    volumes:
      - jellyfin-transcodes:/cache/transcodes
    command: >
      sh -c '
        echo "==> Setting permissions on /cache/transcodes..."
        if chown -R 568:568 /cache/transcodes && chmod -R 775 /cache/transcodes; then
          echo "[SUCCESS] Permissions updated successfully!"
          exit 0
        else
          echo "[ERROR] Failed to set permissions!"
          exit 1
        fi
      '

  # 2. Jellyfin waits for the init container to succeed before booting
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    user: '568:568'
    networks:
      - proxy
    environment:
      - TZ=Etc/GMT+7
      - JELLYFIN_CACHE_DIR=/cache
    ports:
      # Access via http://<IP>:8096 for the initial Base URL setup
      - '8096:8096'
    volumes:
      # Update the left side of these paths if they differ on your NAS
      - /mnt/SSD/config/jellyfin/config:/config
      - /mnt/SSD/config/jellyfin/cache:/cache
      - jellyfin-transcodes:/cache/transcodes
      # Update this to point to your actual media dataset:
      - /mnt/tier-2-hdd-stripe-test/media:/media
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`homelab.akita-beaufort.ts.net`) && PathPrefix(`/jellyfin`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.tls.certresolver=tailscale"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

volumes:
  jellyfin-transcodes:

networks:
  proxy:
    external: true