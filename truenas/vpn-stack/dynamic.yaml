http:
  routers:
    dashboard:
      rule: "Host(`homelab.akita-beaufort.ts.net`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api/http`) || PathPrefix(`/api/tcp`) || PathPrefix(`/api/udp`) || PathPrefix(`/api/overview`) || PathPrefix(`/api/version`) || PathPrefix(`/api/entrypoints`) || PathPrefix(`/api/rawdata`))"
      entryPoints:
        - websecure
      tls:
        certResolver: tailscale
      service: api@internal
      middlewares:
        - dashboard-auth
        - dashboard-slash

  middlewares:
    dashboard-auth:
      basicAuth:
        users:
          - "truenas_admin:$2y$05$yZc2oknLeQnh5nSVImOF1ugMQjFhwWB56VBypJR91iuD.yUzr0e/y"
    dashboard-slash:
      redirectRegex:
        regex: "^https://homelab.akita-beaufort.ts.net/dashboard$"
        replacement: "https://homelab.akita-beaufort.ts.net/dashboard/"
        permanent: true