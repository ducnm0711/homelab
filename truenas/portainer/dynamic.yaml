http:
  routers:
    dashboard:
      rule: "Host(`homelab.akita-beaufort.ts.net`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))"
      entryPoints:
        - websecure
      tls:
        certResolver: tailscale
      service: api@internal
      middlewares:
        - dashboard-auth
        - dashboard-slash
