- Infrastructure:
    - Traefik Dashboard:
        href: https://home-media.akita-beaufort.ts.net/dashboard/
        icon: traefik
        description: Network Proxy & SSL
    - Portainer:
        href: https://home-media.akita-beaufort.ts.net/portainer/
        icon: portainer
        description: Docker Management
        widget:
         type: portainer
         url: http://192.168.1.69:9000
         env: 3
         key: ${PORTAINER_API_KEY}
    - TrueNAS:
        href: https://home-nas-server-01.akita-beaufort.ts.net/truenas/
        icon: truenas
        description: Storage & Server Management
        widget:
          type: truenas
          url: https://192.168.1.69
          version: 2
          key: ${TRUENAS_API_KEY}
          enablePools: true
          nasType: scale
- Media:
